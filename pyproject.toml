[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

[project]
name = "exs-lock-dev"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fabric @ git+https://github.com/Fabric-Development/fabric.git",
    "pam>=0.2.0",
    "pillow>=12.1.1",
    "six>=1.17.0",
]
authors = [
    { name = "kipoha", email = "kipoha.core@gmail.com" },
]

[tool.uv.sources]
fabric = { git = "https://github.com/Fabric-Development/fabric.git" }

[project.scripts]
exs-lock = "exs_lock.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["exs_lock"]
